<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Không Gian Học Tập Của Bạn</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(201, 100%, 13%)',
            foreground: 'hsl(0, 0%, 100%)',
            'muted-foreground': 'hsl(240, 4%, 66%)',
          },
          fontFamily: {
            display: ['"Instrument Serif"', 'serif'],
            body: ['"Inter"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --font-display: 'Instrument Serif', serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    textarea, input {
      user-select: text;
    }

    /* Tối ưu hiệu năng Liquid Glass: giảm blur nặng để chống giật lag trên mobile */
    .liquid-glass {
      background: rgba(11, 23, 38, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
      will-change: transform;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.35) 0%,
        rgba(255, 255, 255, 0.08) 25%,
        rgba(255, 255, 255, 0) 50%,
        rgba(255, 255, 255, 0.25) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-active {
      background: rgba(245, 158, 11, 0.18) !important;
      border-color: rgba(245, 158, 11, 0.45) !important;
      color: #FCD34D !important;
    }

    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

        Velorah<sup class="text-xs">®</sup>

          type="text"

  <script>
    const SUBJECTS = [
      { id: 'math', name: 'Toán học', icon: '📐'},
      { id: 'physics', name: 'Vật lý', icon: '⚡'  },
      { id: 'chemistry', name: 'Hóa học', icon: '🧪'},
      { id: 'literature', name: 'Ngữ văn', icon: '📚'},
      { id: 'english', name: 'Tiếng Anh', icon: '🌍' },
    ];

    let currentUser = localStorage.getItem('velorah_user') || '';
    let currentSubject = SUBJECTS[0];
    let selectedLessonId = null;

    // --- POMODORO TIMER ---
    let totalMinutes = 25;
    let totalSeconds = totalMinutes * 60;
    let timeLeft = totalSeconds;
    let timerInterval = null;
    let isRunning = false;
    let streak = parseInt(localStorage.getItem('velorah_streak') || '0', 10);

    const timerMinutes = document.getElementById('timerMinutes');
    const timerSeconds = document.getElementById('timerSeconds');
    const playIcon = document.getElementById('playIcon');
    const btnTimerText = document.getElementById('btnTimerText');
    const streakCount = document.getElementById('streakCount');
    streakCount.textContent = streak;

    function updateTimerDisplay() {
      timerMinutes.textContent = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      timerSeconds.textContent = String(timeLeft % 60).padStart(2, '0');
    }

    function editTimeDirectly() {
      if (isRunning) return;
      const val = parseInt(prompt("Nhập số phút học:", totalMinutes), 10);
      if (!isNaN(val) && val > 0 && val <= 360) setCustomMinutes(val);
    }

    function setCustomMinutes(mins) {
      clearInterval(timerInterval);
      isRunning = false;
      playIcon.setAttribute('data-lucide', 'play');
      btnTimerText.textContent = "Bắt đầu";
      totalMinutes = mins;
      totalSeconds = mins * 60;
      timeLeft = totalSeconds;
      updateTimerDisplay();
      lucide.createIcons();
    }

    function adjustMinutes(delta) {
      if (isRunning) return;
      let m = totalMinutes + delta;
      if (m < 1) m = 1;
      setCustomMinutes(m);
    }

    document.getElementById('btnToggleTimer').addEventListener('click', () => {
      if (isRunning) {
        clearInterval(timerInterval);
        playIcon.setAttribute('data-lucide', 'play');
        btnTimerText.textContent = "Tiếp tục";
        isRunning = false;
      } else {
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            streak++;
            localStorage.setItem('velorah_streak', streak);
            streakCount.textContent = streak;
            alert("✨ Hoàn thành một hiệp tập trung xuất sắc!");
            timeLeft = totalSeconds;
            isRunning = false;
            updateTimerDisplay();
            playIcon.setAttribute('data-lucide', 'play');
            btnTimerText.textContent = "Bắt đầu";
            lucide.createIcons();
          }
        }, 1000);
        playIcon.setAttribute('data-lucide', 'pause');
        btnTimerText.textContent = "Đang đếm";
        isRunning = true;
      }
      lucide.createIcons();
    });

    document.getElementById('btnResetTimer').addEventListener('click', () => {
      clearInterval(timerInterval);
      timeLeft = totalSeconds;
      isRunning = false;
      playIcon.setAttribute('data-lucide', 'play');
      btnTimerText.textContent = "Bắt đầu";
      updateTimerDisplay();
      lucide.createIcons();
    });

    // --- LOCALSTORAGE TIỀN TỐ USER ---
    function getUserKey(key) { return `velorah_${currentUser}_${key}`; }
    function getData(key, fallback = []) {
      const raw = localStorage.getItem(getUserKey(key));
      return raw ? JSON.parse(raw) : fallback;
    }
    function setData(key, val) { localStorage.setItem(getUserKey(key), JSON.stringify(val)); }

    // --- RENDER MÔN HỌC ---
    const subjectNavList = document.getElementById('subjectNavList');
    const mobileSubjectList = document.getElementById('mobileSubjectList');
    const drawerSubjectList = document.getElementById('drawerSubjectList');

    function renderSubjects() {
      subjectNavList.innerHTML = '';
      mobileSubjectList.innerHTML = '';
      drawerSubjectList.innerHTML = '';

      SUBJECTS.forEach((sub) => {
        const isActive = sub.id === currentSubject.id;

        // Desktop nav
        const btn = document.createElement('button');
        btn.className = `liquid-glass rounded-full px-4 py-1.5 text-xs text-foreground transition-all flex items-center gap-1.5 ${
          isActive ? 'liquid-glass-active font-bold' : 'text-muted-foreground'
        }`;
        btn.innerHTML = `<span>${sub.icon}</span><span>${sub.name}</span>`;
        btn.onclick = () => selectSubject(sub);
        subjectNavList.appendChild(btn);

        // Mobile carousel pill
        const mBtn = document.createElement('button');
        mBtn.className = `liquid-glass rounded-xl px-3 py-1.5 text-xs whitespace-nowrap flex items-center gap-1 transition-all ${
          isActive ? 'liquid-glass-active font-bold' : 'text-muted-foreground'
        }`;
        mBtn.innerHTML = `<span>${sub.icon}</span><span>${sub.name}</span>`;
        mBtn.onclick = () => selectSubject(sub);
        mobileSubjectList.appendChild(mBtn);

        // Drawer nav
        const dBtn = document.createElement('button');
        dBtn.className = `w-full text-left liquid-glass rounded-xl px-3.5 py-2 text-xs text-foreground flex items-center justify-between ${
          isActive ? 'liquid-glass-active font-bold' : ''
        }`;
        dBtn.innerHTML = `<span>${sub.icon} ${sub.name}</span><span class="text-[10px] text-muted-foreground">${sub.grade}</span>`;
        dBtn.onclick = () => { selectSubject(sub); closeDrawer(); };
        drawerSubjectList.appendChild(dBtn);
      });
    }

    function selectSubject(sub) {
      currentSubject = sub;
      document.getElementById('currentSubjectTitle').textContent = sub.name;
      document.getElementById('currentSubjectSub').textContent = sub.grade;
      document.getElementById('subjectIconBadge').textContent = sub.icon;
      document.getElementById('noteSubjectBadge').textContent = `— ${sub.name}`;
      renderSubjects();
      loadSubjectData();
    }

    // --- VỞ GHI CHÉP THEO TỪNG BÀI ---
    const lessonListEl = document.getElementById('lessonList');
    const lessonTitleInput = document.getElementById('currentLessonTitleInput');
    const lessonContentTextarea = document.getElementById('currentLessonContentTextarea');

    function loadLessons() {
      const all = getData('lessons', []);
      const cur = all.filter(l => l.subjectId === currentSubject.id);
      lessonListEl.innerHTML = '';

      if (cur.length === 0) {
        const def = { id: Date.now().toString(), subjectId: currentSubject.id, title: 'Bài 1: Khởi động kiến thức', content: '' };
        all.push(def);
        setData('lessons', all);
        selectedLessonId = def.id;
        loadLessons();
        return;
      }

      if (!cur.some(l => l.id === selectedLessonId)) selectedLessonId = cur[0].id;

      cur.forEach((les) => {
        const div = document.createElement('div');
        const isActive = les.id === selectedLessonId;
        div.className = `p-2 rounded-xl text-xs cursor-pointer truncate border transition-all whitespace-nowrap md:whitespace-normal shrink-0 md:shrink ${
          isActive ? 'bg-amber-500/20 border-amber-500/40 text-amber-300 font-bold' : 'bg-white/5 border-transparent text-muted-foreground hover:bg-white/10'
        }`;
        div.textContent = les.title || 'Chưa đặt tên';
        div.onclick = () => { selectedLessonId = les.id; loadLessons(); };
        lessonListEl.appendChild(div);
      });

      const activeLesson = cur.find(l => l.id === selectedLessonId);
      if (activeLesson) {
        lessonTitleInput.value = activeLesson.title || '';
        lessonContentTextarea.value = activeLesson.content || '';
      }
    }

    function createNewLesson() {
      const all = getData('lessons', []);
      const cur = all.filter(l => l.subjectId === currentSubject.id);
      const newLes = { id: Date.now().toString(), subjectId: currentSubject.id, title: `Bài ${cur.length + 1}: Chuyên đề mới`, content: '' };
      all.push(newLes);
      setData('lessons', all);
      selectedLessonId = newLes.id;
      loadLessons();
    }

    function deleteCurrentLesson() {
      if (!selectedLessonId || !confirm("Xóa bài học này?")) return;
      let all = getData('lessons', []).filter(l => l.id !== selectedLessonId);
      setData('lessons', all);
      selectedLessonId = null;
      loadLessons();
    }

    lessonTitleInput.addEventListener('input', () => {
      if (!selectedLessonId) return;
      const all = getData('lessons', []);
      const cur = all.find(l => l.id === selectedLessonId);
      if (cur) {
        cur.title = lessonTitleInput.value;
        setData('lessons', all);
        const activeItem = lessonListEl.querySelector('.bg-amber-500\\/20');
        if (activeItem) activeItem.textContent = lessonTitleInput.value || 'Chưa đặt tên';
      }
    });

    lessonContentTextarea.addEventListener('input', () => {
      if (!selectedLessonId) return;
      const all = getData('lessons', []);
      const cur = all.find(l => l.id === selectedLessonId);
      if (cur) {
        cur.content = lessonContentTextarea.value;
        setData('lessons', all);
      }
    });

    // --- TÀI LIỆU DRIVE ---
    function toggleAddResourceForm() { document.getElementById('addResourceForm').classList.toggle('hidden'); }
    function renderResources() {
      const all = getData('resources', []).filter(r => r.subjectId === currentSubject.id);
      const list = document.getElementById('resourceList');
      list.innerHTML = all.length === 0 ? `<div class="py-4 text-center text-muted-foreground text-xs">Chưa có liên kết Drive.</div>` : '';

      all.forEach(item => {
        const row = document.createElement('div');
        row.className = 'p-2 bg-black/25 rounded-xl border border-white/5 flex items-center justify-between text-xs hover:border-white/20 transition-all';
        row.innerHTML = `
          <a href="${item.url}" target="_blank" rel="noreferrer" class="truncate flex-1 text-foreground/90 hover:text-amber-300 flex items-center gap-1.5">
            <i data-lucide="external-link" class="w-3.5 h-3.5 text-muted-foreground"></i><span class="truncate">${item.title}</span>
          </a>
          <button onclick="deleteResource('${item.id}')" class="text-muted-foreground hover:text-rose-400 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
        `;
        list.appendChild(row);
      });
      lucide.createIcons();
    }

    document.getElementById('addResourceForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('resourceTitleInput');
      const url = document.getElementById('resourceUrlInput');
      const all = getData('resources', []);
      all.push({ id: Date.now().toString(), subjectId: currentSubject.id, title: title.value.trim(), url: url.value.trim() });
      setData('resources', all);
      title.value = ''; url.value = '';
      toggleAddResourceForm();
      renderResources();
    });

    function deleteResource(id) {
      setData('resources', getData('resources', []).filter(r => r.id !== id));
      renderResources();
    }

    // --- SƠ ĐỒ TƯ DUY ---
    function toggleAddMindmapForm() { document.getElementById('addMindmapForm').classList.toggle('hidden'); }
    function renderMindmaps() {
      const all = getData('mindmaps', []).filter(m => m.subjectId === currentSubject.id);
      const grid = document.getElementById('mindmapGrid');
      grid.innerHTML = all.length === 0 ? `<div class="col-span-full py-4 text-center text-muted-foreground text-xs">Chưa có ảnh sơ đồ.</div>` : '';

      all.forEach(map => {
        const c = document.createElement('div');
        c.className = 'bg-black/35 rounded-xl border border-white/10 overflow-hidden relative group';
        c.innerHTML = `
          <div class="h-16 bg-black/40 overflow-hidden flex items-center justify-center">
            <img src="${map.url}" alt="${map.title}" class="w-full h-full object-cover group-hover:scale-105 transition-all" onerror="this.src='https://images.unsplash.com/photo-1544717305-2782549b5136?w=400';" />
            <a href="${map.url}" target="_blank" rel="noreferrer" class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] font-medium text-white transition-opacity">Xem ↗</a>
          </div>
          <div class="p-1.5 flex items-center justify-between text-[10px]">
            <span class="truncate text-muted-foreground font-medium">${map.title}</span>
            <button onclick="deleteMindmap('${map.id}')" class="text-muted-foreground hover:text-rose-400 p-0.5"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
          </div>
        `;
        grid.appendChild(c);
      });
      lucide.createIcons();
    }

    document.getElementById('addMindmapForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('mapTitleInput');
      const url = document.getElementById('mapUrlInput');
      const all = getData('mindmaps', []);
      all.push({ id: Date.now().toString(), subjectId: currentSubject.id, title: title.value.trim(), url: url.value.trim() });
      setData('mindmaps', all);
      title.value = ''; url.value = '';
      toggleAddMindmapForm();
      renderMindmaps();
    });

    function deleteMindmap(id) {
      setData('mindmaps', getData('mindmaps', []).filter(m => m.id !== id));
      renderMindmaps();
    }

    function loadSubjectData() {
      renderResources();
      loadLessons();
      renderMindmaps();
    }

    // --- DRAWER & AUTH ---
    const drawerMenu = document.getElementById('drawerMenu');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const drawerPanel = document.getElementById('drawerPanel');

    function openDrawer() {
      drawerMenu.classList.remove('invisible', 'pointer-events-none');
      setTimeout(() => {
        drawerBackdrop.classList.add('opacity-100');
        drawerPanel.classList.remove('translate-x-full');
      }, 10);
    }
    function closeDrawer() {
      drawerBackdrop.classList.remove('opacity-100');
      drawerPanel.classList.add('translate-x-full');
      setTimeout(() => drawerMenu.classList.add('invisible', 'pointer-events-none'), 300);
    }

    document.getElementById('btnCloseMenu').addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);

    const authScreen = document.getElementById('authScreen');
    const authForm = document.getElementById('authForm');
    const usernameInput = document.getElementById('usernameInput');

    function checkAuth() {
      if (!currentUser) {
        authScreen.classList.remove('hidden');
      } else {
        authScreen.classList.add('hidden');
        document.getElementById('userBadgeText').textContent = currentUser;
        document.getElementById('drawerUserDisplay').textContent = currentUser;
        renderSubjects();
        loadSubjectData();
      }
    }

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = usernameInput.value.trim();
      if (val) {
        currentUser = val;
        localStorage.setItem('velorah_user', val);
        checkAuth();
      }
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('velorah_user');
      currentUser = '';
      closeDrawer();
      checkAuth();
    });

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      updateTimerDisplay();
      lucide.createIcons();
    });
  </script>
</body>
</html>
